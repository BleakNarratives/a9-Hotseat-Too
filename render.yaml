services:
  - type: web
    name: hotseat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeployTrigger: commit
    envVars:
      # Auto starts with the first configured key and falls back on auth,
      # model, cooldown, daily-limit, billing, and server failures. At least one
      # provider key must be set.
      - key: HOTSEAT_PROVIDER
        value: auto
      # Rotate the session's starting provider across the active pools. Key
      # rotation and fallback still happen inside the selected provider.
      - key: HOTSEAT_SEAT_ROUTER
        value: "1"
      # Prompted once at Blueprint creation. Leave a provider blank to skip it;
      # the provider layer ignores empty keys and falls through to the rest.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      # Prompted once at Blueprint creation. Use letters and digits only: the
      # token travels in a query string, where +, &, # and ? change its meaning.
      - key: HOTSEAT_TOKEN
        sync: false

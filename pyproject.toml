[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hotseat-too"
version = "0.5.0"
description = "Local-first AI pressure cooker: idea audit, arena, debate, panels, and a one-pass BMAD brief."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "BleakNarratives" },
]
keywords = ["ai", "llm", "ollama", "openrouter", "decision-making", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Decision Making",
]
dependencies = []

[project.scripts]
hotseat = "hotseat_core.cli:main"

[project.urls]
Homepage = "https://github.com/BleakNarratives/a9-Hotseat-Too"
Repository = "https://github.com/BleakNarratives/a9-Hotseat-Too"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hotseat_core*"]

[tool.setuptools.package-data]
hotseat_core = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#070608">
  <title>THE HOT SEAT — Live Arena</title>
  <link rel="stylesheet" href="/table.css">
</head>
<body>
  <div class="room" id="room" data-phase="lobby">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>

    <!-- Top minimal telemetry bar -->
    <header class="hud-top">
      <div class="brand-lockup">
        <span class="pulse-dot" id="status-dot"></span>
        <span class="brand-title">THE HOT SEAT</span>
        <span class="plaque" id="house-plaque">THE HOUSE</span>
      </div>

      <div class="hud-actions">
        <button class="pill-btn" id="format-trigger" type="button" aria-expanded="false" aria-controls="cast-drawer">
          <span class="pill-kicker">CAST</span>
          <strong id="program-name">The Arena</strong>
        </button>
        <button class="pill-btn wire-pill" id="wire" type="button" aria-expanded="false" hidden>
          <span class="pill-kicker">WIRE</span>
          <strong id="wire-count">0</strong>
        </button>
        <a class="ghost-nav" href="/console" data-view-link title="War Room Console">CONSOLE</a>
      </div>
    </header>

    <!-- Slide-down Cast & Call Sheet Drawer (only opens when tapped) -->
    <aside class="drawer" id="cast-drawer" hidden>
      <div class="drawer-inner">
        <div class="drawer-head">
          <span>FORMAT &amp; CALL SHEET (MAX 5)</span>
          <button class="drawer-close" id="drawer-close" type="button">DONE</button>
        </div>
        <div class="program-pills" id="program-list"></div>
        <div class="call-head">
          <span>CUSTOM ROSTER</span>
          <strong id="call-count">5 called</strong>
        </div>
        <div class="call-list" id="call-list"></div>
      </div>
    </aside>

    <!-- Scout Wire Popover -->
    <aside class="wire-drawer" id="wire-drawer" hidden>
      <div class="drawer-head">
        <span id="wire-note">SCOUT WIRE</span>
        <button class="drawer-close" id="wire-close" type="button">CLOSE</button>
      </div>
      <div class="wire-list" id="wire-list"></div>
    </aside>

    <!-- 3D Spatial Arena Stage -->
    <main class="arena-viewport">
      <div class="arena-3d">
        <div class="floor-plane" aria-hidden="true">
          <div class="orbit-ring outer"></div>
          <div class="orbit-ring inner"></div>
          <div class="pit-core"></div>
        </div>
        <div class="cast" id="cast" aria-label="The boardroom"></div>
      </div>

      <!-- Center Active Speaker / Pit Readout -->
      <section class="speech-stage" id="speech-stage" aria-live="polite">
        <div class="speech-header" id="speech-header">
          <span class="speaker-badge" id="active-speaker">STANDBY</span>
          <span class="speaker-role" id="active-role">select a cast or pitch the pit</span>
          <button class="replay-btn" id="replay-btn" type="button" hidden title="Read this turn aloud">🔊</button>
        </div>
        <div class="speech-body" id="active-speech">
          <p class="idle-prompt" id="live-note">One idea. Five voices. Zero fluff. Pitch the room below.</p>
        </div>
        <p class="stamp" id="stamp" hidden></p>
      </section>
    </main>

    <!-- Bottom Direct-Manipulation Dock -->
    <footer class="hud-dock">
      <div class="dial-strip">
        <label class="dial-meta" for="dial">
          <span>HEAT</span>
          <output id="dial-value" for="dial">7</output>
          <em id="dial-label">loose</em>
        </label>
        <input id="dial" type="range" min="0" max="11" step="1" value="7" aria-label="Panel intensity, zero to eleven">
        <button class="mini-ctrl" id="dial-roll" type="button" title="Randomize heat">🎲</button>
        <button class="mini-ctrl" id="voice" type="button" aria-pressed="false" title="Toggle voice read-aloud">🔇</button>
        <button class="mini-ctrl" id="strip" type="button" hidden title="Download Markdown transcript">⬇ MD</button>
        <button class="mini-ctrl gavel-btn" id="gavel" type="button" aria-label="Stop or clear session" title="Stop or clear">🔨</button>
      </div>

      <form class="case-file" id="case-file" autocomplete="off">
        <button class="mic-btn" id="case-mic" type="button" aria-pressed="false" aria-label="Dictate" title="Voice to text">🎙</button>
        <input id="case-input" name="topic" type="text" maxlength="400" required
               placeholder="Pitch the room. Press return…" aria-describedby="case-hint">
        <button class="send-btn" id="send-btn" type="submit">IGNITE</button>
      </form>

      <form class="follow-up" id="follow-up" autocomplete="off" hidden>
        <input id="follow-input" name="message" type="text" maxlength="400" required
               placeholder="Challenge the verdict or ask one more thing…">
        <button class="send-btn" type="submit">PUSH BACK</button>
      </form>
      <span class="sr-only" id="case-hint"></span>
    </footer>
  </div>
  <script src="/table.js"></script>
</body>
</html>

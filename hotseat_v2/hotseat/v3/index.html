<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 5px; }
        button { background: #0f0; color: #000; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold; }
        .output { border: 1px solid #333; margin-top: 20px; padding: 10px; min-height: 100px; }
    </style>
</head>
<body>
    <h1>V3_DIRECT_ACCESS</h1>
    <input type="text" id="dirInput" placeholder="Enter folder name...">
    <button onclick="fetchDir()">SCAN</button>
    <div class="output" id="out">Results will appear here...</div>

    <script>
        async function fetchDir() {
            const dir = document.getElementById('dirInput').value;
            const out = document.getElementById('out');
            try {
                const res = await fetch(`http://localhost:8000/list/${dir}`);
                const data = await res.json();
                if (data.error) {
                    out.innerText = data.error;
                } else {
                    out.innerHTML = `<h3>Listing: ${data.folder}</h3><ul>` + 
                        data.content.map(f => `<li>${f}</li>`).join('') + `</ul>`;
                }
            } catch (e) {
                out.innerText = "Error: Is the backend running?";
            }
        }
    </script>
</body>
</html>
